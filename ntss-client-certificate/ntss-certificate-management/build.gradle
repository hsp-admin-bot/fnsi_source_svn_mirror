import org.gradle.internal.os.OperatingSystem
import java.nio.charset.StandardCharsets

buildscript {
  repositories {
    mavenLocal()
    mavenCentral()
    maven { url = uri("https://start.spring.io/plugins-release") }
    maven { url = uri("https://start.spring.io/milestone") }
    maven { url = uri("https://plugins.gradle.org/m2/") }
  }
  dependencies {
    classpath "org.springframework.boot:spring-boot-gradle-plugin:${spring_boot_version}"
    classpath "io.spring.gradle:dependency-management-plugin:${dependency_management_plugin_version}"
    classpath "gradle.plugin.com.github.psxpaul:gradle-execfork-plugin:0.1.8"
    classpath "com.github.node-gradle.node:com.github.node-gradle.node.gradle.plugin:${node_gradle_plugin_version}"
    classpath "org.asciidoctor:asciidoctor-gradle-jvm:${asciidoctor_plugin_version}"
  }
}

apply plugin: 'maven-publish'
apply plugin: 'org.asciidoctor.jvm.convert'
apply plugin: 'org.springframework.boot'
apply plugin: 'war'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'idea'
apply plugin: 'com.github.psxpaul.execfork'
apply plugin: 'com.github.node-gradle.node'
defaultTasks 'bootRun'

asciidoctorj {
  version = "${asciidoctorj_version}"
}

bootJar {
  archiveBaseName = 'ntss-certificate-management'
  mainClass = 'jp.co.nikkiso.ntss.certificate_management.NtssCertificateManagementApplication'
  manifest {
    attributes 'Start-Class': 'jp.co.nikkiso.ntss.certificate_management.NtssCertificateManagementApplication'
  }

  doLast {
    def jarFile = archiveFile.get().asFile
    def launchScript = '''#!/bin/sh
set -e
if [ -n "$JAVA_HOME" ]; then
  JAVA_CMD="$JAVA_HOME/bin/java"
else
  JAVA_CMD="java"
fi
exec "$JAVA_CMD" $JAVA_OPTS -jar "$0" "$@"

'''
    def existingBytes = jarFile.bytes
    def scriptBytes = launchScript.getBytes(StandardCharsets.UTF_8)

    def output = new ByteArrayOutputStream(scriptBytes.length + existingBytes.length)
    output.write(scriptBytes)
    output.write(existingBytes)
    jarFile.bytes = output.toByteArray()
    jarFile.setExecutable(true, false)
  }
}

bootWar {
  mainClass = 'jp.co.nikkiso.ntss.certificate_management.NtssCertificateManagementApplication'
}

war {
  enabled = true
  archiveBaseName = 'ntss-certificate-management'
}

springBoot {
  mainClass = 'jp.co.nikkiso.ntss.certificate_management.NtssCertificateManagementApplication'
  buildInfo()
}

if (OperatingSystem.current().isWindows()) {
  task pathingJar(type: Jar) {
    dependsOn configurations.runtimeClasspath
    archiveAppendix = 'pathing'

    doFirst {
      manifest {
        attributes 'Class-Path': configurations.runtimeClasspath.getFiles().collect {
          it.toURI().toString().replaceFirst(/file:\/+/, '/').replaceAll(' ', '%20')
        }.join(' ')
      }
    }
  }

  bootRun {
    dependsOn pathingJar
    doFirst {
      classpath = files("$buildDir/classes/java/main", "$buildDir/resources/main", pathingJar.archiveFile)
    }
  }
} else {
  bootRun {
    jvmArgs = ["-Dspring.output.ansi.enabled=ALWAYS"]
  }
}

ext {
  snippetsDir = file('build/generated-snippets')
  apiDocDir = file('build/api-docs')
}

jacoco {
  toolVersion = '0.8.8'
}

jacocoTestReport {
  reports {
    xml.required = false
    csv.required = false
  }
}

apply from: 'gradle/eclipse.gradle'
apply from: 'gradle/docker.gradle'

if (project.hasProperty('prod')) {
  apply from: 'gradle/profile_prod.gradle'
} else {
  apply from: 'gradle/profile_dev.gradle'
}

task startSpringBootApp(type: com.github.psxpaul.task.ExecFork) {
  if (OperatingSystem.current().isWindows()) {
    commandLine = "$project.rootDir/gradlew.bat"
  } else {
    commandLine = "$project.rootDir/gradlew"
  }
  args = ['bootRun', '-x', 'test', '-x', 'npm_install', '-x', 'npmRunLint']
  standardOutput = file("$buildDir/bootrun.log")
  errorOutput = file("$buildDir/bootrun-error.log")
  waitForPort = 8080
  waitForOutput = 'Started NtssCertificateManagementApplication in'
  timeout = 300
}

task npmRunTestE2e(type: NpmTask, dependsOn: startSpringBootApp) {
  args = ['run', 'test:e2e']
}

description = ''

repositories {
  mavenLocal()
  mavenCentral()
  maven { url = uri('https://start.spring.io/milestone') }
  maven { url = uri('https://start.spring.io/snapshot') }
  maven { url = uri('https://repository.jboss.org/nexus/content/repositories/releases') }
  maven { url = uri('https://oss.sonatype.org/content/repositories/releases') }
  maven { url = uri('https://oss.sonatype.org/content/repositories/snapshots') }
  maven { url = uri('https://repo.maven.apache.org/maven2') }
}

configurations {
  asciidoctorExt
}

dependencies {
  implementation "org.springframework.boot:spring-boot-autoconfigure"
  implementation "org.springframework.boot:spring-boot-starter-web"
  // Boot 4: runtimeClasspath に spring-web が含まれないため追加（SpringBootServletInitializer 用）
  runtimeOnly "org.springframework:spring-web"
  // Boot 4: WAR 外部 Tomcat 向け。spring-boot-starter-tomcat からの移行（公式移行ガイド）
  providedRuntime "org.springframework.boot:spring-boot-starter-tomcat-runtime"
  implementation "org.springframework.boot:spring-boot-starter-jdbc"
  implementation("org.springframework.boot:spring-boot-starter-actuator") {
    exclude group: 'io.micrometer', module: 'micrometer-core'
  }
  compileOnly "org.projectlombok:lombok:${lombok_version}"
  annotationProcessor "org.projectlombok:lombok:${lombok_version}"
  implementation "org.springframework.boot:spring-boot-starter-security"
  testImplementation("org.springframework.boot:spring-boot-starter-test") {
    exclude group: 'com.vaadin.external.google', module: 'android-json'
  }
  testImplementation "org.springframework.boot:spring-boot-test"
  testImplementation "junit:junit"
  testImplementation "org.mockito:mockito-core"
  testImplementation "org.springframework.security:spring-security-test"
  asciidoctorExt("org.springframework.restdocs:spring-restdocs-asciidoctor:${spring_restdocs_version}") {
    exclude group: 'org.asciidoctor', module: 'asciidoctorj'
    exclude group: 'org.asciidoctor', module: 'asciidoctorj-api'
  }
  testImplementation "org.springframework.restdocs:spring-restdocs-mockmvc:${spring_restdocs_version}"
  compileOnly "org.springframework.boot:spring-boot-configuration-processor"
  implementation "org.json:json:${json_java_version}"
  implementation 'commons-io:commons-io:2.22.0'
  implementation "org.springframework.boot:spring-boot-starter-aspectj"
  implementation "org.seasar.doma.boot:doma-spring-boot-starter:${doma_spring_version}"
  implementation "org.seasar.doma:doma-core:${doma_core_version}"
  annotationProcessor "org.seasar.doma:doma-processor:${doma_core_version}"
  testCompileOnly "org.projectlombok:lombok:${lombok_version}"
  testAnnotationProcessor "org.projectlombok:lombok:${lombok_version}"
}

asciidoctor {
  configurations 'asciidoctorExt'
  sourceDir = snippetsDir
  outputDir = apiDocDir
  dependsOn test
}

asciidoctor.doFirst {
  copy {
    from 'src/docs/asciidoc'
    into snippetsDir
  }
}

task apiDoc(dependsOn: asciidoctor) {
}

clean { delete 'target' }

task cleanResources(type: Delete) { delete 'build/resources' }

task wrapper(type: Wrapper) { gradleVersion = '9.5.0' }

task stage(dependsOn: [bootWar, bootJar]) {
}

assemble.dependsOn bootJar

node {
  version = "${node_version}"
  npmVersion = "${npm_version}"
  download = project.hasProperty('nodeInstall')
  nodeProjectDir = file("${project.projectDir}/src/main/frontend")
}

tasks.withType(Test) {
  systemProperty 'file.encoding', 'UTF-8'
}

def domaResources = ['doma.compile.config', 'META-INF/**/*.sql']
task copyDomaResourcesJava(type: Copy) {
  from sourceSets.main.resources.srcDirs
  into compileJava.destinationDirectory
  include domaResources
}
compileJava {
  dependsOn copyDomaResourcesJava
}
processResources {
  exclude domaResources
}

processResources.dependsOn cleanResources, bootBuildInfo
bootBuildInfo.mustRunAfter cleanResources
build.dependsOn asciidoctor
