import org.gradle.internal.os.OperatingSystem

apply plugin: 'org.springframework.boot'
//apply plugin: 'com.moowork.node'
apply plugin: 'com.github.node-gradle.node'

ext { logbackLoglevel = "DEBUG" }

dependencies {
  //implementation "org.springframework.boot:spring-boot-devtools"
}

def profiles = 'dev'

bootRun { args = [] }

task npmRunLint(type: NpmTask, dependsOn: 'npm_install') {
  args = ["run", "lint"]
}

task npmRunBuildDev(type: NpmTask) {
  args = ["run", "build"]
}

task npmTest(type: NpmTask, dependsOn: 'npm_install') {
  args = ["test"]
}

war { webAppDirName = 'build/www/' }

processResources {
  filesMatching('**/logback-spring.xml') {
    filter {
      it.replace('#logback.loglevel#', logbackLoglevel)
    }
  }
  filesMatching('**/application.yml') {
    filter {
      it.replace('#project.version#', version)
    }
    filter {
      it.replace('#spring.profiles.active#', profiles)
    }
  }
}

test.dependsOn npmTest
processResources.dependsOn npmRunLint, npmRunBuildDev
npmRunBuildDev.onlyIf { project.hasProperty('frontend') }
