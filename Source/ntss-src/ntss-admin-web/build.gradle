}

def bootRunLogFile = file("$buildDir/bootrun.log")
def bootRunErrorFile = file("$buildDir/bootrun-error.log")
def bootRunPidFile = file("$buildDir/bootrun.pid")

def bootRunCommand = {
  if (OperatingSystem.current().isWindows()) {
    return ["$project.rootDir/gradlew.bat"]
  }
  ["$project.rootDir/gradlew"]
}

def bootRunArgs = ['bootRun', '-x', 'test', '-x', 'npm_install', '-x', 'npmRunLint']

def isPortOpen = { int port ->
  try {
    Socket socket = new Socket("127.0.0.1", port)
    socket.close()
    true
  } catch (IOException ignored) {
    false
  }
}

def cleanupStaleBootRunPid = {
  if (!bootRunPidFile.exists()) {
    return
  }

  Long pid = bootRunPidFile.text.trim().isLong() ? bootRunPidFile.text.trim().toLong() : null
  if (pid == null) {
    bootRunPidFile.delete()
    return
  }

  def processHandle = ProcessHandle.of(pid)
  if (!processHandle.isPresent() || !processHandle.get().isAlive()) {
    bootRunPidFile.delete()
  }
}

def waitForBootRun = { int port, int timeoutSeconds, String outputMarker ->
  long deadline = System.nanoTime() + TimeUnit.SECONDS.toNanos(timeoutSeconds)
  while (System.nanoTime() < deadline) {
    boolean portReady = isPortOpen(port)
    boolean outputReady = bootRunLogFile.exists() && bootRunLogFile.text.contains(outputMarker)
    if (portReady && outputReady) {
      return
    }
    Thread.sleep(1000)
  }

  throw new GradleException("Timed out waiting for NtssAdminWebApplication to start on port ${port}.")
}

// E2Eテスト用`BootRun`タスク
task startSpringBootApp {
  doLast {
    cleanupStaleBootRunPid()

    if (bootRunPidFile.exists() && isPortOpen(8080)) {
      logger.lifecycle("Spring Boot app is already running on port 8080.")
      return
    }

    bootRunLogFile.parentFile.mkdirs()

    Process process = new ProcessBuilder(bootRunCommand() + bootRunArgs)
      .directory(project.rootDir)
      .redirectOutput(bootRunLogFile)
      .redirectError(bootRunErrorFile)
      .start()

    bootRunPidFile.text = process.pid().toString()
    waitForBootRun(8080, 300, 'Started NtssAdminWebApplication in')
  }
}

task stopSpringBootApp {
  doLast {
    cleanupStaleBootRunPid()
    if (!bootRunPidFile.exists()) {
      return
    }

    Long pid = bootRunPidFile.text.trim().toLong()
    def processHandle = ProcessHandle.of(pid)
    if (processHandle.isPresent() && processHandle.get().isAlive()) {
      processHandle.get().destroy()
      Thread.sleep(1000)
      if (processHandle.get().isAlive()) {
        processHandle.get().destroyForcibly()
      }
    }
    bootRunPidFile.delete()
  }
}

// E2Eテスト実行タスク
task npmRunTestE2e(type: NpmTask, dependsOn: startSpringBootApp) {
  args = [ "run", "test:e2e" ]
  finalizedBy stopSpringBootApp
}

test {
  outputs.dir snippetsDir
  // backendTestProbe keeps CI-style test wiring but overlays the local Docker test DB.
  if (project.hasProperty('backendTestProbe')) {
    jvmArgs = ["-Dspring.profiles.active=ci,testdb"]
  } else if (project.hasProperty('ci')) {
    // CI用にテスト時のprofileを設定
    jvmArgs = ["-Dspring.profiles.active=ci"]
  } else {
    npmTest.dependsOn npmRunTestE2e
  }
  maxHeapSize = "1024m"
}

