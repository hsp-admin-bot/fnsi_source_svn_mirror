import org.gradle.internal.os.OperatingSystem

buildscript {
  repositories {
    mavenLocal()
    mavenCentral()
    maven { url = uri("https://start.spring.io/plugins-release") }
    maven { url = uri("https://start.spring.io/milestone") }
    maven { url = uri("https://plugins.gradle.org/m2/") }
  }
  dependencies {
    classpath "org.springframework.boot:spring-boot-gradle-plugin:${spring_boot_version}"
    classpath "io.spring.gradle:dependency-management-plugin:${dependency_management_plugin_version}"
    classpath "org.flywaydb:flyway-core:${flyway_version}"
    classpath "org.flywaydb:flyway-database-postgresql:${flyway_version}"
    classpath "org.postgresql:postgresql:${flyway_postgresql_driver_version}"
  }
}

apply plugin: 'maven-publish'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'idea'
defaultTasks 'bootRun'

bootJar {
  enabled = false // 実行可能Jarを作成しない(単体では動かさない)
}

jar {
  enabled = true // Jarを作成する(依存元に組み込む)
  duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

springBoot {
  buildInfo()
}

if (OperatingSystem.current().isWindows()) {
  task pathingJar(type: Jar) {
    dependsOn configurations.runtimeClasspath
    archiveAppendix = 'pathing'

    doFirst {
      manifest {
        attributes 'Class-Path': configurations.runtimeClasspath.getFiles().collect {
          it.toURI().toString().replaceFirst(/file:\/+/, '/').replaceAll(' ', '%20')
        }.join(' ')
      }
    }
  }

  bootRun {
    dependsOn pathingJar
    doFirst {
      classpath = files("$buildDir/classes/java/main", "$buildDir/resources/main", pathingJar.archiveFile)
    }
  }
} else {
  bootRun {
    jvmArgs = ["-Dspring.output.ansi.enabled=ALWAYS"]
  }
}

test {
  if (project.hasProperty('ci')) {
    jvmArgs = ["-Dspring.profiles.active=ci"]
  }
}

jacoco {
  toolVersion = '0.8.8'
}

jacocoTestReport {
  reports {
    xml.required = false
    csv.required = false
  }
}

apply from: 'gradle/eclipse.gradle'
apply from: 'gradle/docker.gradle'

description = ''

repositories {
  mavenLocal()
  mavenCentral()
  maven { url = uri('https://start.spring.io/milestone') }
  maven { url = uri('https://start.spring.io/snapshot') }
  maven { url = uri('https://repository.jboss.org/nexus/content/repositories/releases') }
  maven { url = uri('https://oss.sonatype.org/content/repositories/releases') }
  maven { url = uri('https://oss.sonatype.org/content/repositories/snapshots') }
  maven { url = uri('https://repo.maven.apache.org/maven2') }
}

dependencies {
  implementation "org.springframework.boot:spring-boot-autoconfigure"
  implementation "org.springframework.boot:spring-boot-starter-web"
  implementation "org.springframework.boot:spring-boot-starter-jdbc"
  implementation("org.springframework.boot:spring-boot-starter-actuator") {
    exclude group: 'io.micrometer', module: 'micrometer-core'
  }
  implementation "org.springframework.boot:spring-boot-starter-aspectj"
  implementation "org.seasar.doma.boot:doma-spring-boot-starter:${doma_spring_version}"
  implementation "org.seasar.doma:doma-core:${doma_core_version}"
  annotationProcessor "org.seasar.doma:doma-processor:${doma_core_version}"
  implementation "org.postgresql:postgresql"
  compileOnly "org.projectlombok:lombok:${lombok_version}"
  annotationProcessor "org.projectlombok:lombok:${lombok_version}"
  implementation "org.modelmapper:modelmapper:${modelmapper_version}"
  implementation "com.google.guava:guava:${guava_version}"
  testImplementation("org.springframework.boot:spring-boot-starter-test") {
    exclude group: 'com.vaadin.external.google', module: 'android-json'
  }
  testImplementation "org.springframework.boot:spring-boot-test"
  testImplementation "junit:junit"
  testImplementation "org.mockito:mockito-core"
  annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
  implementation "jakarta.xml.bind:jakarta.xml.bind-api:${jakarta_xml_bind_api_version}"
  implementation "org.glassfish.jaxb:jaxb-runtime:${jakarta_xml_bind_runtime_version}"
  testCompileOnly "org.projectlombok:lombok:${lombok_version}"
  testAnnotationProcessor "org.projectlombok:lombok:${lombok_version}"
}

clean { delete 'target' }

task cleanResources(type: Delete) { delete 'build/resources' }

task wrapper(type: Wrapper) { gradleVersion = '9.5.0' }

def databaseList = ['db7']

def loadFlywayProperties = { String databaseName ->
  def configFile = file("src/main/flyway/flyway_${profile}/flyway_${profile}${databaseName}.conf")
  if (!configFile.exists()) {
    throw new GradleException("Flyway config not found: ${configFile}")
  }

  Properties properties = new Properties()
  configFile.withInputStream { properties.load(it) }
  properties
}

def splitFlywayValues = { String value ->
  value?.split(/\s*,\s*/)?.findAll { it } ?: []
}

def normalizeFlywayLocation = { String location ->
  if (!location?.startsWith('filesystem:')) {
    return location
  }

  def rawPath = location.substring('filesystem:'.length())
  def locationFile = new File(rawPath)
  def resolved = locationFile.isAbsolute() ? locationFile : rootProject.file(rawPath)
  "filesystem:${resolved.path.replace('\\', '/')}"
}

def createFlyway = { String databaseName, boolean allowClean = false ->
  Properties properties = loadFlywayProperties(databaseName)
  def configuration = org.flywaydb.core.Flyway.configure()
    .dataSource(
      properties.getProperty('flyway.url'),
      properties.getProperty('flyway.user'),
      properties.getProperty('flyway.password')
    )

  def locations = splitFlywayValues(properties.getProperty('flyway.locations'))
    .collect { normalizeFlywayLocation(it) }
  if (!locations.isEmpty()) {
    configuration.locations(*((String[]) locations))
  }

  def schemas = splitFlywayValues(properties.getProperty('flyway.schemas'))
  if (!schemas.isEmpty()) {
    configuration.schemas(*((String[]) schemas))
  }

  if (allowClean) {
    configuration.cleanDisabled(false)
  }

  configuration.load()
}

databaseList.each { name ->
  tasks.register("${name}FlywayMigrate") {
    group = 'Flyway'
    description = "Run Flyway migrate using flyway_${profile}${name}.conf."
    doLast {
      createFlyway(name).migrate()
    }
  }

  tasks.register("${name}FlywayBaseline") {
    group = 'Flyway'
    description = "Run Flyway baseline using flyway_${profile}${name}.conf."
    doLast {
      createFlyway(name).baseline()
    }
  }

  tasks.register("${name}FlywayClean") {
    group = 'Flyway'
    description = "Run Flyway clean using flyway_${profile}${name}.conf."
    doLast {
      createFlyway(name, true).clean()
    }
  }

  tasks.register("${name}FlywayInfo") {
    group = 'Flyway'
    description = "Run Flyway info using flyway_${profile}${name}.conf."
    doLast {
      createFlyway(name).info()
    }
  }
}

tasks.register('flywayMigrateAll') {
  databaseList.each { name ->
    dependsOn "${name}FlywayMigrate"
  }
}

tasks.register('flywayCleanAll') {
  databaseList.each { name ->
    dependsOn "${name}FlywayClean"
  }
}

tasks.withType(Test) {
  systemProperty 'file.encoding', 'UTF-8'
}

def domaResources = ['doma.compile.config', 'META-INF/**/*.sql']
task copyDomaResourcesJava(type: Copy) {
  from sourceSets.main.resources.srcDirs
  into compileJava.destinationDirectory
  include domaResources
}
compileJava {
  dependsOn copyDomaResourcesJava
}
processResources {
  exclude domaResources
}