; デバイスエッジアプリ共通設定
;

; 施設コード(6桁)
FACILITY_CODE=999900
; マスタ同期用、デバイス番号(1〜99)
AWS_IOT_DEVICE_NO=1
; デバイス製造番号(11桁)
DEVICE_SERIAL_NO=10250025576

; 緊急発報用ファイル格納先フォルダ
;
M_NOTICE_FOLDER1=/mnt/usb/ntss/M_Notice
M_NOTICE_FOLDER2=/mnt/sd/ntss/M_Notice
M_NOTICE_FOLDER3=./M_Notice

;　データ収集用ファイル格納先フォルダ
;
DATA_COLLECT_FOLDER1=/mnt/usb/ntss/DataCollect
DATA_COLLECT_FOLDER2=/mnt/sd/ntss/DataCollect
DATA_COLLECT_FOLDER3=./DataCollect

; データ収集用一時ファイル格納先フォルダ
;
TEMP_FOLDER1=/mnt/usb/ntss/DataCollect_Temp
TEMP_FOLDER2=/mnt/sd/ntss/DataCollect_Temp
TEMP_FOLDER3=./DataCollect_Temp

; 治療中モニタ送信間隔[秒]
;
SEND_DIALYSIS_MONITOR_INTERVAL=20

; 未治療時モニタ送信間隔[秒]
;
SEND_UNTREATMENT_MONITOR_INTERVAL=60

