; デバイスエッジアプリネットワーク設定
;

; 圧縮パスワード
;
ZIP_PW=NTSS

; アップロードファイル最大サイズ(MB単位)
; ※超えた場合はファイルが分割されてアップロードされる
;
UPLOAD_FILE_MAXSIZE=80

; AWSホスト名
;
; TDC local
AWS_HOST=http://192.168.102.57:8080
; NKK開発環境
;AWS_HOST=http://ntss-platform-public-app-alb-2041513679.ap-northeast-1.elb.amazonaws.com
; NKK検証環境(非IoT)
;AWS_HOST=http://ntss-platform-public-app-alb02-743132961.ap-northeast-1.elb.amazonaws.com

; WebSocket接続先ホストアドレス
; TDC local
WEBSOCKET_HOST=ws://192.168.102.57:8080
; NKK開発環境
;WEBSOCKET_HOST=ws://ntss-platform-public-app-alb-2041513679.ap-northeast-1.elb.amazonaws.com
; NKK検証環境(非IoT)
;WEBSOCKET_HOST=ws://ntss-platform-public-app-alb02-743132961.ap-northeast-1.elb.amazonaws.com

; アップロード先
;
; 開発環境 
UPLOAD_PATH=s3://ntss-s3-root/%s/DEfile/%d
; 検証環境(IoT)
;UPLOAD_PATH=s3://ntss-s3-root-verification/CONF/%s/%d
; 検証環境(非IoT)
;UPLOAD_PATH=s3://ntss-s3-root-verification-provisional/CONF/%s/%d

; アップロードリトライ回数
;
UPLOAD_RETRY_COUNT=3

; アップロードリトライ待ち時間(秒)
;
UPLOAD_RETRY_WAIT_TIME=30

; WebSocket KeepAlive通知間隔(秒)
;
;WEBSOCKET_KEEP_ALIVE_INTERVAL=120
