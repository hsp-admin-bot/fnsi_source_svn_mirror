<script type="text/javascript">
    RED.nodes.registerType('custom-file-watch',{
        category: 'advanced-input',
        color: '#a6bbcf',
        defaults: {
            name: {value:""},
          files: {value:""},
          recursive: {value:""}
        },
        inputs:1,
        outputs:1,
        icon: "file.png",
        label: function() {
            return this.name||this.files||"custom-file-watch";
        }
    });
</script>

<script type="text/x-red" data-template-name="custom-file-watch">
  <div class="form-row node-input-filename">
       <label for="node-input-files"><i class="fa fa-file"></i>&nbsp;files</label>
       <input id="node-input-files" type="text" tabindex="1" placeholder="files">
  </div>
  <div class="form-row">
      <label>&nbsp;</label>
      <input type="checkbox" id="node-input-recursive" style="display:inline-block; width:auto; vertical-align:top;">
      <label for="node-input-recursive" style="width:70%;">recursive</label>
  </div>
  <div class="form-row">
      <label for="node-input-name"><i class="fa fa-tag"></i>Name</label>
      <input type="text" id="node-input-name" data-i18n="[placeholder]common.label.name">
  </div>
</script>

<script type="text/x-red" data-help-name="custom-file-watch">
<p></p>

<h3>入力</h3>
	<dl class="message-properties">
		<dt>files
			<span class="property-type">string</span>
		</dt>
		<dd> ファイル更新監視する<code>ファイル名</code>または<code>ディレクトリ名</code>を指定<br/>空の場合には<code>msg.files</code>が優先される </dd>
		<dt>msg.files
			<span class="property-type">string</span>
		</dt>
		<dd> ノードの指定<code>files</code>が空の場合に使用される
		</dd>
	</dl>

<h3>出力</h3>
	<dl class="message-properties">
		<dt>msg
			<span class="property-type">object</span>
		</dt>
		<dd> </dd>
		<dt>msg.payload
			<span class="property-type">string</span>
		</dt>
		<dd> 変更のあったファイルの<code>フルパス</code>が設定される</dd>
		<dt>msg.filename
			<span class="property-type">string</span>
		</dt>
		<dd> 変更のあったファイルの<code>ファイル名</code>が設定される </dd>
		<dt>msg.topic
			<span class="property-type">string</span>
		</dt>
		<dd> 変更のあったファイルがある<code>ディレクトリのパス</code>が設定される</dd>
	</dl>

</script>
