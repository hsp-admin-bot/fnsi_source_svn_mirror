# -Dspring.profiles.activeの指定なし
# これがないと登録されてるJOBが全て起動時に実行される。

# 以下全て開発環境の設定にしておく。
# -Dspring.profiles.activeの指定なしでも開発環境の設定で動作するようになるため。
spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,
      org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
  mongodb:
    host: stg-ies-docdb-cluster.cluster-clizq2mnnwjp.ap-northeast-1.docdb.amazonaws.com
    port: 27017
    database: ntss
    username: nkk
    password: nkk
    field-naming-strategy: org.springframework.data.mapping.model.SnakeCaseFieldNamingStrategy

  batch:
    chunkSize: 99999999 #ファイル単位でトランザクションをかけたいため大きい数値を設定
    job.enabled: false
    jdbc:
      initialize-schema: always

  task: annotation-driven

  main:
    allow-circular-references: true

  # spring_batchのjob情報関連テーブル作成DB設定
  datasource:
    jdbc-url: jdbc:postgresql://stg-ies-convert-service-cluster.cluster-clizq2mnnwjp.ap-northeast-1.rds.amazonaws.com:5432/convert_db
    username: convert
    password: convert
    table_prefix: ntss.
    driverClassName: org.postgresql.Driver
    hikari:
      auto-commit: false

  servlet:
    multipart:
      max-file-size: 5000MB
      max-request-size: 5000MB
      enabled: true
datasource:
  h2:
    driverClassName: org.h2.Driver
    jdbc-url: jdbc:h2:mem:test
    username: sa
    password:
  nkk4:
    jdbc-url: jdbc:postgresql://stg-ntss-platform-service-cluster.cluster-clizq2mnnwjp.ap-northeast-1.rds.amazonaws.com:5432/ntss_db4_ait1
    username: nkk4
    password: nkk4
    table_prefix: ntss.
    driverClassName: org.postgresql.Driver
  nkk5:
    jdbc-url: jdbc:postgresql://stg-ntss-platform-service-cluster.cluster-clizq2mnnwjp.ap-northeast-1.rds.amazonaws.com:5432/ntss_db5_ait1
    username: nkk5
    password: nkk5
    table_prefix: ntss.
    driverClassName: org.postgresql.Driver
  nkk6:
    jdbc-url: jdbc:postgresql://stg-ntss-platform-service-cluster.cluster-clizq2mnnwjp.ap-northeast-1.rds.amazonaws.com:5432/ntss_db6_ait1
    username: nkk6
    password: nkk6
    table_prefix: ntss.
    driverClassName: org.postgresql.Driver
  convert:
    jdbc-url: jdbc:postgresql://ies-nkk-fnsi.cluster-cnr7cvlcb4ym.ap-northeast-1.rds.amazonaws.com:5432/convert_db
    username: convert
    password: convert
    table_prefix: ntss.
    driverClassName: org.postgresql.Driver

nkk4_prefix: ntss.
nkk5_prefix: ntss.
nkk6_prefix: ntss.
convert_prefix: ntss.

csv_path: /var/log/ntss-convert/Count

token:
  #单ビット：分
  token_timeout : 60

# Zipファイルのパスワード
zip-file-config:
  password: password

# 完了したファイルの退避場所
completed-file-config:
  path: /var/log/ntss-convert/completed

