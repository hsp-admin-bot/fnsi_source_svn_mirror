plugins {
//	id 'org.springframework.boot' version '2.1.4.RELEASE'
	//id 'org.springframework.boot' version '2.3.12.RELEASE'
	id 'org.springframework.boot' version '2.7.18'
	id 'java'
	/*
	id "application"
	id 'war' 
	*/
}

apply plugin: 'io.spring.dependency-management'
apply plugin: 'application'
/*
apply plugin: 'war'
*/

group = 'batch'
version = '1.0.0'
sourceCompatibility = '17'
targetCompatibility = '17'

bootJar {
	mainClassName = "web.BatchServerApplication"
	// 実行できるjarファイルを作成する
	launchScript()
}


// mongo切替用profileの設定
if (project.hasProperty('mongo')) {
	bootRun {
		jvmArgs = ["-Dspring.profiles.active=mongo"]
	}
}
/*
bootWar {
	mainClassName = "web.BatchServerApplication"
}
*/

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}


configurations.all {
	exclude group:'org.apache.logging.log4j',module: 'log4j-to-slf4j'
	exclude group:'org.apache.logging.log4j',module: 'log4j-api'
    exclude group: "org.slf4j", module: "slf4j-log4j12"
    exclude group: "log4j", module: "log4j"
}

repositories {
	mavenLocal()
	mavenCentral()
	'maven(http://repo.spring.io/milestone)'
	'maven(http://repo.spring.io/snapshot)'
	'maven(https://repository.jboss.org/nexus/content/repositories/releases)'
	'maven(https://oss.sonatype.org/content/repositories/releases)'
	'maven(https://oss.sonatype.org/content/repositories/snapshots)'
	'maven(http://repo.maven.apache.org/maven2)'
}

ext {
	set('springBootAdminVersion', '2.7.16')
}

dependencies {
	implementation 'org.postgresql:postgresql'
	implementation 'org.springframework.boot:spring-boot-starter-batch'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'de.codecentric:spring-boot-admin-starter-client'
	implementation 'de.codecentric:spring-boot-admin-starter-server'
	implementation 'net.lingala.zip4j:zip4j:2.0.3'
	compileOnly 'org.projectlombok:lombok:1.18.26'
	runtimeOnly 'org.glassfish.jaxb:jaxb-runtime'
	annotationProcessor 'org.projectlombok:lombok:1.18.26'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.batch:spring-batch-test'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation "com.amazonaws:aws-java-sdk-ses:1.12.66"
	implementation "com.amazonaws:aws-java-sdk-dynamodb:1.12.66"
	implementation "org.seasar.doma.boot:doma-spring-boot-starter:1.1.1"
	implementation "org.seasar.doma:doma:2.24.0"
	implementation "org.json:json:20180813"
	implementation group: 'com.google.code.gson', name: 'gson', version: '2.8.6'
	implementation group: 'org.springframework.retry', name: 'spring-retry', version: '1.3.4'
	implementation group: 'org.aspectj', name: 'aspectjweaver', version: '1.9.9'
	implementation "de.siegmar:fastcsv:1.0.3"

	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation group: 'io.jsonwebtoken', name: 'jjwt', version: '0.9.1'
	implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security'
}

dependencyManagement {
	imports {
		mavenBom "de.codecentric:spring-boot-admin-dependencies:${springBootAdminVersion}"
	}
}

apply plugin : "java"
ext {
   javaMainClass = "web.BatchServerApplication"
}
 
application {
    mainClassName = javaMainClass
}

project.gradle.projectsEvaluated {
    applicationDefaultJvmArgs = ["-Dspring.profiles.active=${project.gradle.startParameter.systemPropertiesArgs['spring.profiles.active']}"]
}

bootRun {
    if (project.hasProperty('args')) {
        args project.args.split(',' as Closure)
    }
}

jar {
	enabled = false
    manifest {
        attributes 'Main-Class': 'web.BatchServerApplication'
    }
}

javadoc {
	options.charSet = 'UTF-8'
	options.encoding = 'UTF-8'
    failOnError = false
}