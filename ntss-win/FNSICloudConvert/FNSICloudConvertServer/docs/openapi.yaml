openapi: 3.0.3
info:
  title: FNSI Cloud Convert Server API
  version: 1.0.0
  description: REST API for FNSI on-prem/cloud conversion jobs.
servers:
  - url: /fnsi-cloud-convert-server
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Login and issue JWT tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login succeeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Refresh access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token refreshed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/upload:
    post:
      tags: [Transfer]
      summary: Upload migration archive.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, uploadType, facilityCode]
              properties:
                file:
                  type: string
                  format: binary
                uploadType:
                  type: string
                  enum: [PG_DUMP, MONGO_DUMP, FILES]
                facilityCode:
                  type: string
      responses:
        '202':
          description: Upload accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/download/{jobId}/{fileType}:
    get:
      tags: [Transfer]
      summary: Download generated migration archive.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: fileType
          in: path
          required: true
          schema:
            type: string
            enum: [pg, mongo, files]
      responses:
        '200':
          description: ZIP file stream.
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/facilities:
    get:
      tags: [Facility]
      summary: Get facility list.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 100
        - name: keyword
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Facility list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/facilities/count:
    get:
      tags: [Facility]
      summary: Get table row counts for a facility.
      parameters:
        - name: facility_cd
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Facility row counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilityCountResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/facilities/seq-plan:
    get:
      tags: [Facility]
      summary: Get sequence reservation plan for offline migration.
      parameters:
        - name: facility_cd
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sequence reservation plan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FacilitySeqReservePlanResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/jobs:
    post:
      tags: [Job]
      summary: Create migration job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateJobRequest'
      responses:
        '202':
          description: Job created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateJobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/jobs/{jobId}:
    get:
      tags: [Job]
      summary: Get job status.
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Job status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [Job]
      summary: Interrupt job.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: reason
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Job interrupted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterruptJobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/jobs/{jobId}/logs:
    get:
      tags: [Job]
      summary: Get job logs.
      parameters:
        - $ref: '#/components/parameters/JobId'
        - name: offset
          in: query
          schema:
            type: integer
            format: int64
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 200
        - name: level
          in: query
          schema:
            type: string
        - name: taskId
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Job logs.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/jobs/{jobId}/resume:
    post:
      tags: [Job]
      summary: Resume interrupted job.
      parameters:
        - $ref: '#/components/parameters/JobId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResumeJobRequest'
      responses:
        '202':
          description: Job resume accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumeJobResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/system/info:
    get:
      tags: [System]
      summary: Get converter server system information.
      responses:
        '200':
          description: System information.
          content:
            application/json:
              schema:
                type: object
        '401':
          $ref: '#/components/responses/Unauthorized'
  /actuator/health:
    get:
      tags: [Actuator]
      summary: Health check.
      security: []
      responses:
        '200':
          description: Health status.
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    JobId:
      name: jobId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  responses:
    Unauthorized:
      description: Authentication is required or token is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Access is forbidden.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    LoginRequest:
      type: object
      required: [facilityCd, dispUserId, password]
      properties:
        facilityCd:
          type: string
        dispUserId:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          format: int64
        tokenType:
          type: string
          example: Bearer
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    RefreshResponse:
      type: object
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
        tokenType:
          type: string
          example: Bearer
    UploadResponse:
      type: object
      properties:
        uploadId:
          type: string
        uploadType:
          type: string
        storagePath:
          type: string
        fileSize:
          type: integer
          format: int64
        uploadedAt:
          type: string
          format: date-time
        message:
          type: string
    FacilityInfo:
      type: object
      properties:
        facilityCd:
          type: string
        facilityName:
          type: string
        region:
          type: string
        status:
          type: string
        lastMigratedAt:
          type: string
          format: date-time
    FacilityListResponse:
      type: object
      properties:
        total:
          type: integer
          format: int64
        page:
          type: integer
        size:
          type: integer
        facilities:
          type: array
          items:
            $ref: '#/components/schemas/FacilityInfo'
    FacilityCountResponse:
      type: object
      properties:
        facilityCodes:
          type: array
          items:
            type: string
        tableCounts:
          type: object
          additionalProperties:
            type: integer
            format: int64
        totalRows:
          type: integer
          format: int64
        calculatedAt:
          type: string
          format: date-time
    FacilitySeqReservePlanResponse:
      type: object
      properties:
        facilityCd:
          type: string
        generatedAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            type: object
    CreateJobRequest:
      type: object
      required: [direction, facilityCodes]
      properties:
        direction:
          type: string
          enum: [off2on, on2off]
        facilityCodes:
          type: array
          items:
            type: string
        uploadIds:
          $ref: '#/components/schemas/UploadIds'
        seqStartMap:
          type: object
          additionalProperties:
            type: integer
            format: int64
        options:
          $ref: '#/components/schemas/JobOptions'
    UploadIds:
      type: object
      properties:
        pgDump:
          type: string
        mongoDump:
          type: string
        files:
          type: string
    JobOptions:
      type: object
      properties:
        parallelTasks:
          type: integer
        retryLimit:
          type: integer
    CreateJobResponse:
      type: object
      properties:
        jobId:
          type: integer
          format: int64
        jobName:
          type: string
        direction:
          type: string
        facilityCodes:
          type: array
          items:
            type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        estimatedTasks:
          type: integer
    JobStatusResponse:
      type: object
      properties:
        jobId:
          type: integer
          format: int64
        jobName:
          type: string
        direction:
          type: string
        status:
          type: string
        startedAt:
          type: string
          format: date-time
        finishedAt:
          type: string
          format: date-time
        elapsedSeconds:
          type: integer
          format: int64
        tasks:
          type: array
          items:
            type: object
        progress:
          type: object
    InterruptJobResponse:
      type: object
      properties:
        jobId:
          type: integer
          format: int64
        status:
          type: string
        message:
          type: string
    ResumeJobRequest:
      type: object
      properties:
        seqStartMap:
          type: object
          additionalProperties:
            type: integer
            format: int64
    ResumeJobResponse:
      type: object
      properties:
        jobId:
          type: integer
          format: int64
        status:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string
