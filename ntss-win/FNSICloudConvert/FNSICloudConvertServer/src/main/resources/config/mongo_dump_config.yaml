# MongoDB ダンプ対象コレクション設定
#
# dump        : false のコレクションはダンプ対象外
# filterField : facility_cd フィルター用フィールド名
#               null の場合は全件対象（グローバルコレクション）

mongo-dump:
  collections:

    # =====================================================================
    # 指示履歴（ind_history）
    # facility_cd + pat_id による施設フィルタ
    # =====================================================================
    - name: ind_history
      dump: true
      filterField: facility_cd

    # =====================================================================
    # イベントログ（log_event）
    # =====================================================================
    - name: log_event
      dump: false
      filterField: facility_cd

    # =====================================================================
    # オーダー履歴（ord_main_hst）
    # =====================================================================
    - name: ord_main_hst
      dump: true
      filterField: facility_cd

    # =====================================================================
    # 患者グループ詳細履歴
    # =====================================================================
    - name: pat_group_detail_history
      dump: true
      filterField: facility_cd

    # =====================================================================
    # 保険情報履歴
    # =====================================================================
    - name: pat_insurance_history
      dump: true
      filterField: facility_cd

    # =====================================================================
    # 患者基本情報履歴
    # =====================================================================
    - name: pat_main_history
      dump: true
      filterField: facility_cd

    # =====================================================================
    # 患者個人情報履歴
    # =====================================================================
    - name: pat_personal_main_history
      dump: true
      filterField: facility_cd

    # =====================================================================
    # 患者ユニーク情報履歴
    # =====================================================================
    - name: pat_unique_history
      dump: true
      filterField: facility_cd

    # =====================================================================
    # 結果履歴（rst_history）
    # =====================================================================
    - name: rst_history
      dump: true
      filterField: facility_cd
