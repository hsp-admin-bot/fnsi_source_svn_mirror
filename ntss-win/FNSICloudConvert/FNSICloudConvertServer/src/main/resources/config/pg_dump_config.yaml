      whereTemplate: "facility_cd IN (:facilityList)"
      direction: both
      db: ntss_db4

    - name: sys_signin_manager
      idColumn: null
      dump: false
      whereTemplate: null
      direction: both
      db: ntss_db4

    - name: sys_system_manager
      idColumn: null
      dump: false
      whereTemplate: null
      direction: both
      db: ntss_db4

    # =====================================================================
    # ntss_db5
    # =====================================================================
    # FK の親テーブルを先頭に配置
    # COPY FROM（順方向）: 最初に挿入 / DELETE（逆順）: 最後に削除
