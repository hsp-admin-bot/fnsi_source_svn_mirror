# PostgreSQL ダンプ対象テーブル設定
#
# direction : both(両方向) / off2on(離線→在線のみ) / on2off(在線→離線のみ)
# dump      : false のテーブルはダンプ対象外
# idColumn  : PK が整数シリアルの場合に指定（PK マッピング対象）。文字列コード PK の場合は null
# whereTemplate : facility_cd フィルター用 WHERE 句テンプレート（null = 全件対象）
# db        : ターゲット DB 名 (ntss_db4 / ntss_db5 / ntss_db6)

pg-dump:
  tables:

    # =====================================================================
    # ntss_db4
    # =====================================================================
    - name: mnt_websocket_certification
      idColumn: null
      dump: true
      whereTemplate: "facility_cd IN (:facilityList)"
      direction: both
      db: ntss_db4

    - name: mst_facility_hash
      idColumn: null
      dump: true
      whereTemplate: "facility_cd IN (:facilityList)"
      direction: both
      db: ntss_db4

