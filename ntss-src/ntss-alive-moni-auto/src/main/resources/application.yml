spring:
  profiles:
    active: mongo
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,
             org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
  main:
    allow-circular-references: true
  data:
    mongodb:
      host: 192.168.100.11
      port: 27017
      database: ntss
      username: nkk
      password: nkk
  datasource:
    default:
      jdbc-url: jdbc:postgresql://192.168.100.10:5432/ntss_db5?currentSchema=ntss
      driver-class-name: org.postgresql.Driver
      username: nkk5
      password: nkk5
    personal:
      jdbc-url: jdbc:postgresql://192.168.100.10:5432/ntss_db6?currentSchema=ntss
      driver-class-name: org.postgresql.Driver
      username: nkk6
      password: nkk6
    auth:
      jdbc-url: jdbc:postgresql://192.168.100.10:5432/ntss_db4?currentSchema=ntss
      driver-class-name: org.postgresql.Driver
      username: nkk4
      password: nkk4
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  application:
    name: ntss-alive-moni-auto
  jmx:
    default-domain: ntss-alive-moni-auto

server:
  compression:
    enabled: true
    min-response-size: 1048576 # 1M = 1024 * 1024(bytes)

doma:
  dialect: postgres

securityporicy:
  accesskeycheck: true

cloud:
  aws:
    region:
      auto: false
      static: ap-northeast-1
    stack:
      auto: false

scheduler:
  initialDelay: 10000
  fixedDelay: 30000
  procTimeout: 30000
  stopTimeout: 30000

aliveMoni:
  request:
    uri: http://localhost:8080/alive_moni/api/request
  response:
    uri: http://localhost:8080/alive_moni/api/response

ntss:
  logging:
    rolling:
      max-history: 14
      max-history-app: 14
---
spring:
  config.activate.on-profile: mongo
  autoconfigure:
    exclude:
