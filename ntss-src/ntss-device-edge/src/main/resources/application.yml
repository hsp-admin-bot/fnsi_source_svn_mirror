spring:
  profiles:
    active: mongo
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,
             org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
  main:
    allow-circular-references: true
  mongodb:
    host: 192.168.100.11
    port: 27017
    database: ntss
    username: nkk
    password: nkk
  datasource:
    default:
      jdbc-url: jdbc:postgresql://192.168.100.10:5432/ntss_db5?currentSchema=ntss&stringtype=unspecified
      driver-class-name: org.postgresql.Driver
      username: nkk5
      password: nkk5
    personal:
      jdbc-url: jdbc:postgresql://192.168.100.10:5432/ntss_db6?currentSchema=ntss&stringtype=unspecified
      driver-class-name: org.postgresql.Driver
      username: nkk6
      password: nkk6
    auth:
      jdbc-url: jdbc:postgresql://192.168.100.10:5432/ntss_db4?currentSchema=ntss&stringtype=unspecified
      driver-class-name: org.postgresql.Driver
      username: nkk4
      password: nkk4
  jackson:
    datatype:
      datetime:
        WRITE_DATES_AS_TIMESTAMPS: false
  application:
    name: ntss-device-edge
  jmx:
    default-domain: ntss-device-edge

server:
  compression:
    enabled: true
    min-response-size: 1048576 # 1M = 1024 * 1024(bytes)

doma:
  dialect: postgres

logging:
  level:
    org.springframework.transaction.interceptor: TRACE

cloud:
  aws:
    region:
      auto: false
      static: ap-northeast-1

    stack:
      auto: false

securityporicy:
  accesskeycheck: true

ntss:
  report:
    s3-bucket: 'ntss-s3-root-service'
    cache-dir: '/tmp/device_edge/report/cache'
    createTmpDir: '/opt/fnsi/tmp/report-create'
  pat-event:
    s3-bucket: '/efs/ntss-s3-root-service/%s/Pevent'
    cache-dir: '/opt/fnsi/cache/pat-event'
  device-edge:
    rest:
      download: http://192.168.100.12:8080/ntss-admin-web/api/motion_record/detail/gathering/download

    web-socket-notify:
      app-sv: 
        ws-port: 8090
        ws-api: '/ntss-client-comm/api/sendclient'
        header-name: 'SSECCAYEK'
        header-value: 'NTSS-NKK-ESM-TDC-YSK'
      device-sv:
        ws-port: 8080
        ws-api: '/ntss-client-comm/api/sendclient'
        header-name: 'SSECCAYEK'
        header-value: 'NTSS-NKK-ESM-TDC-YSK'
  logging:
    rolling:
      max-history: 14
      max-history-app: 14
---
spring:
  config.activate.on-profile: mongo
  autoconfigure:
    exclude:
