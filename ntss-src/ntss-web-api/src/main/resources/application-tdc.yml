spring:
  #  profiles:
  #    active: mongo
  #  autoconfigure:
  #    exclude: org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,
  #             org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
  main:
    allow-circular-references: true
  data:
    mongodb:
      host: 192.168.102.88
      port: 27017
      database: ntss
      username: nkk
      password: nkk
  datasource:
    default:
      jdbc-url: jdbc:postgresql://192.168.102.162:5432/ntss_db5?currentSchema=ntss&stringtype=unspecified
      driver-class-name: org.postgresql.Driver
      username: nkk5
      password: nkk5
      maximum-pool-size: 20
      minimum-idle: 10
    personal:
      jdbc-url: jdbc:postgresql://192.168.102.162:5432/ntss_db6?currentSchema=ntss&stringtype=unspecified
      driver-class-name: org.postgresql.Driver
      username: nkk6
      password: nkk6
    auth:
      jdbc-url: jdbc:postgresql://192.168.102.162:5432/ntss_db4?currentSchema=ntss&stringtype=unspecified
      driver-class-name: org.postgresql.Driver
      username: nkk4
      password: nkk4
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  application:
    name: ntss-web-api
  jmx:
    default-domain: ntss-web-api

server:
  compression:
    enabled: true
    min-response-size: 1048576 # 1M = 1024 * 1024(bytes)

doma:
  dialect: postgres

logging:
  level:
    org.springframework.transaction.interceptor: TRACE

securityporicy:
  accesskeycheck: true

schedule-extend:
  cron: 0 0 2 * * *
  execute: true

cloud:
  aws:
    region:
      auto: false
      static: ap-northeast-1
    stack:
      auto: false

fileIO:
  pathSeparator: /
  processTimeout: 300
  deleteFileTimeout: 10
  upload:
    fileJoinDir: /opt/fnsi/file-join
    tempDir: /opt/fnsi/tmp/upload
    tempPreFix: NtssUploadTempFile
    tempSufFix: .tmp

ntss:
  web-api:
    web-socket-notify:
      app-sv:
        ws-port: 8090
        ws-api: '/ntss-client-comm/api/sendclient'
        header-name: 'SSECCAYEK'
        header-value: 'NTSS-NKK-ESM-TDC-YSK'
    coop-api:
      url: http://192.168.102.88:8080/ntss-coop-api
      header-name: 'SSECCAYEK'
      header-value: 'NTSS-NKK-ESM-TDC-YSK'
  logging:
    rolling:
      max-history: 14
      max-history-app: 14
  report:
    s3-bucket: 's3://ntss-s3-root-service/%s/Report'
    cache-dir: '/opt/fnsi/cache/report'
    createTmpDir: '/opt/fnsi/tmp/report-create'
---
spring:
  config.activate.on-profile: mongo
  autoconfigure:
    exclude:
