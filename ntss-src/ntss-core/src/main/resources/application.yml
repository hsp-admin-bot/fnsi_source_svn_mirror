# ntss-coreの/src/main/resourcesのapplication.ymlは基本的に使用しません。
# 呼び出し元(ntss-admin-webなど)で定義されているため。
# stgやprodなど各profile用のapplication.ymlを作る必要はありません。
# ntss-coreで必要な設定は、テスト(/src/test/resourcesで定義)のみです。
spring:
  datasource:
    default:
      jdbc-url: jdbc:postgresql://localhost:5432/ntss_db5?currentSchema=ntss&stringtype=unspecified
      driver-class-name: org.postgresql.Driver
      username: nkk5
      password: nkk5
    personal:
      jdbc-url: jdbc:postgresql://localhost:5432/ntss_db6?currentSchema=ntss&stringtype=unspecified
      driver-class-name: org.postgresql.Driver
      username: nkk6
      password: nkk6
    auth:
      jdbc-url: jdbc:postgresql://localhost:5432/ntss_db4?currentSchema=ntss&stringtype=unspecified
      driver-class-name: org.postgresql.Driver
      username: nkk4
      password: nkk4
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
      

doma:
  dialect: postgres

logging:
  level:
    org.springframework.transaction.interceptor: TRACE

cloud:
  aws:
    region:
      auto: false
      static: ap-northeast-1 # 東京リージョン

ntss:
  m-notice:
    mail:
      sesRegion: us-west-2
      fromAddress: NTSS-Support@nikkiso.co.jp
  logging:
    appender:
      file-name: /tmp/ntss-admin-web/log/{0}/{0}.log
    rolling:
      file-name-pattern:  /tmp/ntss-admin-web/log/{0}/{0}_%d'{'yyyyMMdd'}'.log
      max-history: 14
