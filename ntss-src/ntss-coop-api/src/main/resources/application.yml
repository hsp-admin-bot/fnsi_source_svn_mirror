spring:
  profiles:
    active: mongo
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,
             org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
  main:
    allow-circular-references: true
  data:
    mongodb:
      host: 192.168.100.11
      port: 27017
      database: ntss
      username: nkk
      password: nkk
  datasource:
    default:
      jdbc-url: jdbc:postgresql://192.168.100.10:5432/ntss_db5?currentSchema=ntss&stringtype=unspecified
      driver-class-name: org.postgresql.Driver
      username: nkk5
      password: nkk5
    personal:
      jdbc-url: jdbc:postgresql://192.168.100.10:5432/ntss_db6?currentSchema=ntss&stringtype=unspecified
      driver-class-name: org.postgresql.Driver
      username: nkk6
      password: nkk6
    auth:
      jdbc-url: jdbc:postgresql://192.168.100.10:5432/ntss_db4?currentSchema=ntss&stringtype=unspecified
      driver-class-name: org.postgresql.Driver
      username: nkk4
      password: nkk4
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  application:
    name: ntss-coop-api
  jmx:
    default-domain: ntss-coop-api

server:
  servlet:
    contextPath: /ntss-coop-api
  compression:
    enabled: true
    min-response-size: 1048576 # 1M = 1024 * 1024(bytes)

doma:
  dialect: postgres

securityporicy:
  accesskeycheck: true

ntss:
  logging:
    rolling:
      max-history: 14
      max-history-app: 14
  report:
    s3-bucket: '/efs/ntss-s3-root-service/%s/Pevent'
    cache-dir: '/opt/ntss-coop-api/report/cache'
    createTmpDir: '/opt/fnsi/tmp/create-tmp'
    createJournalTmp: '/opt/fnsi/tmp/report-journal'
  pat-event:
    s3-bucket: 'dev-ntss-s3-root-service'
    cache-dir: '/opt/ntss-admin-web/pat-event/cache'
  web-api:
    header-name: 'SSECCAYEK'
    header-value: 'NTSS-NKK-ESM-TDC-YSK'
    url: http://192.168.100.13:8080/ntss-web-api
  coop-api:
    header-name: 'SSECCAYEK'
    header-value: 'NTSS-NKK-ESM-TDC-YSK'

cloud:
  aws:
    endpoint:
    region:
      auto: false
      static: ap-northeast-1
    stack:
      auto: false

websocket:
  dataset:
    path: /internal/dataset
    time-path: /internal/time-dataset
  split:
    size: 1
  if-edge-mnt:
    wsPath: /ifedge/maintenance/ws
    requestHTTP: http://
    postMsgAPI: :8080/ntss-coop-api/ifedge/maintenance
    resourcePath: /RESOUCEPATH
    waitMills: 10000
    waitcount: 30
    commandSaveDir: /command
    commandSettingDir: /files
    commandSettingFile: setting.config
  if-edge-journal:
    path: /ifedge/journal
---
spring:
  config.activate.on-profile: mongo
  autoconfigure:
    exclude:
