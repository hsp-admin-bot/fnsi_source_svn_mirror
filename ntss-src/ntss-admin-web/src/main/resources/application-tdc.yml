spring:
  #  profiles:
  autoconfigure:
    exclude:
  main:
    allow-circular-references: true
  data:
    mongodb:
      host: 192.168.102.88
      port: 27017
      database: ntss
      username: nkk
      password: nkk
  datasource:
    default:
      jdbc-url: jdbc:postgresql://192.168.102.162:5432/ntss_db5?currentSchema=ntss&stringtype=unspecified
      driver-class-name: org.postgresql.Driver
      username: nkk5
      password: nkk5
    personal:
      jdbc-url: jdbc:postgresql://192.168.102.162:5432/ntss_db6?currentSchema=ntss&stringtype=unspecified
      driver-class-name: org.postgresql.Driver
      username: nkk6
      password: nkk6
    auth:
      jdbc-url: jdbc:postgresql://192.168.102.162:5432/ntss_db4?currentSchema=ntss&stringtype=unspecified
      driver-class-name: org.postgresql.Driver
      username: nkk4
      password: nkk4
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  application:
    name: ntss-admin-web
  jmx:
    default-domain: ntss-admin-web
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 100MB

amazon:
  dynamodb:
    accesskey:
    secretkey:
    endpoint: http://192.168.102.88:8000
    region: us-west-2

server:
  servlet:
    contextPath: /ntss-admin-web

doma:
  dialect: postgres

logging:
  file.name: /tmp/ntss-admin-web.log
  level:
    org.springframework.transaction.interceptor: TRACE
    org.mongodb.driver: ERROR

cloud:
  aws:
    region:
      auto: false
      static: ap-northeast-1
    stack:
      auto: false

ntss:
  logging:
    rolling:
      max-history: 14
      max-history-app: 14
  report:
    s3-bucket: 's3://ntss-s3-root-service/%s/Report'
    cache-dir: '/opt/fnsi/cache/report'
    printTmpDir: '/opt/fnsi/tmp/report-print'
    createTmpDir: '/opt/fnsi/tmp/report-create'
  bbs-info:
    s3-bucket: 'ntss-s3-root-service/%s/BBS'
  pat-event:
    s3-bucket: 'ntss-s3-root-service/%s/Pevent'
    cache-dir: '/opt/fnsi/cache/pat-event'
  admin-web:
    data-gathering:
      url: 'http://192.168.102.88:8080/data_gathering/api/request/device'
      header-name: 'SSECCAYEK'
      header-value: 'NTSS-NKK-ESM-TDC-YSK'
    web-api:
      current-pat-clear: /util/CurrentPatClear
      set-next-pat: /util/SetNextPatInfo
      upload: '/upload'
      header-name: 'SSECCAYEK'
      header-value: 'NTSS-NKK-ESM-TDC-YSK'
      url: http://192.168.102.88:8080/ntss-web-api
    web-socket-notify:
      app-connect-url: 'ws://192.168.102.88:8080/ntss-client-comm/ntssclientcomm'
      vpn-app-connect-url: 'ws://192.168.102.88:8090/ntss-client-comm/ntssclientcomm'
      app-sv:
        ws-port: 8080
        ws-api: '/ntss-client-comm/api/sendclient'
        connectchk-api: '/ntss-client-comm/api/chkclientconnect'
        header-name: 'SSECCAYEK'
        header-value: 'NTSS-NKK-ESM-TDC-YSK'
      device-sv:
        ws-port: 8080
        ws-api: '/ntss-client-comm/api/sendclient'
        header-name: 'SSECCAYEK'
        header-value: 'NTSS-NKK-ESM-TDC-YSK'
    sign-in:
      restriction: false
    m-notice:
      header-name: 'SSECCAYEK'
      header-value: 'NTSS-NKK-ESM-TDC-YSK'
      maker-notice: /api/makerNotice
      url: http://192.168.102.88:8080/ntss-m-notice
    coop-api:
      url: http://192.168.102.88:8080/ntss-coop-api
    device-edge:
      url: http://192.168.102.88:8080/device_edge
    device-edge-manage:
      s3-bucket: 'ntss-s3-root-service/%s/DEConf'
      conf-upload-path: 's3://ntss-s3-root-service/%s/Defile'
    certificate:
      enable: false
---
spring:
  config.activate.on-profile: mongo
  autoconfigure:
    exclude:
