import org.gradle.internal.os.OperatingSystem

buildscript {
  repositories {
//    jcenter()
    mavenLocal()
    mavenCentral()
    maven { url "https://start.spring.io/plugins-release" }
    maven { url "https://start.spring.io/milestone" }
    maven { url "https://plugins.gradle.org/m2/" }
  }
  dependencies {
    classpath "org.springframework.boot:spring-boot-gradle-plugin:${spring_boot_version}"
//    classpath 'io.spring.gradle:propdeps-plugin:0.0.10.RELEASE'
    classpath "com.github.node-gradle:gradle-node-plugin:3.5.1"
    classpath "io.spring.gradle:dependency-management-plugin:1.0.7.RELEASE"
    classpath "org.flywaydb:flyway-gradle-plugin:6.0.4"
    classpath "com.github.psxpaul:gradle-execfork-plugin:0.2.2"
  }
}

plugins {
  id "org.asciidoctor.convert" version "1.5.3"
  id "com.github.node-gradle.node" version "3.5.1"
}

apply plugin: 'maven-publish'
apply plugin: 'org.springframework.boot'
apply plugin: 'war'
apply plugin: 'org.flywaydb.flyway'
//apply plugin: 'propdeps'
//apply plugin: 'propdeps-eclipse'
apply plugin: 'com.github.node-gradle.node'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'idea'
apply plugin: "com.github.psxpaul.execfork"
defaultTasks 'bootRun'

bootJar {
  archiveBaseName = 'ntss-admin-web'
  mainClass = 'jp.co.nikkiso.ntss.admin_web.NtssAdminWebApplication'
  manifest {
		attributes 'Start-Class': 'jp.co.nikkiso.ntss.admin_web.NtssAdminWebApplication'
	}
  launchScript()
}

bootWar {
  mainClass = 'jp.co.nikkiso.ntss.admin_web.NtssAdminWebApplication'
}

war {
  enabled = true
  archiveBaseName = 'ntss-admin-web'
}

springBoot {
  mainClass = 'jp.co.nikkiso.ntss.admin_web.NtssAdminWebApplication'
  buildInfo()
}

if (OperatingSystem.current().isWindows()) {
  task pathingJar(type: Jar) {
    dependsOn configurations.runtimeClasspath
    archiveAppendix = 'pathing'

    doFirst {
      manifest {
        attributes 'Class-Path': configurations.runtimeClasspath.getFiles().collect {
          it.toURI().toString().replaceFirst(/file:\/+/, '/').replaceAll(' ', '%20')
        }.join(' ')
      }
    }
  }

  bootRun {
    dependsOn pathingJar
    doFirst {
      classpath = files("$buildDir/classes/java/main", "$buildDir/resources/main", pathingJar.archiveFile)
    }
  }
} else {
  bootRun {
    jvmArgs = ["-Dspring.output.ansi.enabled=ALWAYS"]
  }
}

ext {
  snippetsDir = file('build/generated-snippets')
  apiDocDir = file('build/api-docs')
}

jacoco {
  toolVersion = "0.8.8"
}

jacocoTestReport {
  reports {
    xml.enabled false
    csv.enabled false
  }
}

apply from: 'gradle/eclipse.gradle'
apply from: 'gradle/docker.gradle'
//jhipster-needle-gradle-apply-from - JHipster will add additional gradle scripts to be applied here

if (project.hasProperty('prod')) {
  apply from: 'gradle/profile_prod.gradle'
} else {
  apply from: 'gradle/profile_dev.gradle'
}

// mongo切替用profileの設定
if (project.hasProperty('mongo')) {
  bootRun {
    jvmArgs = ["-Dspring.profiles.active=mongo"]
  }
}

// E2Eテスト用`BootRun`タスク
task startSpringBootApp(type: com.github.psxpaul.task.ExecFork) {
  if (OperatingSystem.current().isWindows()) {
    commandLine = "$project.rootDir/gradlew.bat"
  } else {
    commandLine = "$project.rootDir/gradlew"
  }
  args = [ 'bootRun', '-x', 'test', '-x', 'npm_install', '-x', 'npmRunLint' ]
  standardOutput = file("$buildDir/bootrun.log")
  errorOutput = file("$buildDir/bootrun-error.log")
  waitForPort = 8080
  waitForOutput = 'Started NtssAdminWebApplication in'
  timeout = 300
  // 互換維持のため残すが、現ブランチでは実行しない
  onlyIf { false }
}

// E2Eテスト実行タスク
task npmRunTestE2e(type: NpmTask, dependsOn: startSpringBootApp) {
  args = [ "run", "test:e2e" ]
  // 互換維持のため残すが、現ブランチでは実行しない
  onlyIf { false }
}

test {
  outputs.dir snippetsDir
  // CI用にテスト時のprofileを設定
  if (project.hasProperty('ci')) {
    jvmArgs = ["-Dspring.profiles.active=ci"]
  } else {
    npmTest.dependsOn npmRunTestE2e
  }
  maxHeapSize = "1024m"
}

description = ''

repositories {
  mavenLocal()
  mavenCentral()
//  jcenter()
  maven { url 'https://start.spring.io/milestone' }
  maven { url 'https://start.spring.io/snapshot' }
  maven { url 'https://repository.jboss.org/nexus/content/repositories/releases' }
  maven { url 'https://oss.sonatype.org/content/repositories/releases' }
  maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
  maven { url 'https://repo.maven.apache.org/maven2' }
}

dependencies {
  implementation "org.springframework.boot:spring-boot-autoconfigure"
  implementation "org.springframework.boot:spring-boot-starter-web"
  providedRuntime "org.springframework.boot:spring-boot-starter-tomcat"
  implementation "org.springframework.boot:spring-boot-starter-security"
  implementation "org.springframework.boot:spring-boot-starter-jdbc"
  implementation "org.springframework.boot:spring-boot-starter-actuator"
  implementation 'org.springframework.cloud:spring-cloud-aws-context:2.1.1.RELEASE'
  implementation 'org.projectlombok:lombok:1.18.28'
  annotationProcessor 'org.projectlombok:lombok:1.18.28'
  implementation 'org.modelmapper:modelmapper:2.3.4'
  implementation group: 'org.bouncycastle', name: 'bcprov-jdk18on', version: "${bouncycastle_version}"
  implementation group: 'com.google.guava', name: 'guava', version: '27.1-jre'
  testImplementation ("org.springframework.boot:spring-boot-starter-test") {
    exclude group: 'com.vaadin.external.google', module: 'android-json'
  }
  testImplementation "org.springframework.boot:spring-boot-test"
  testImplementation "junit:junit"
  testImplementation "org.mockito:mockito-core"
  annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
  testImplementation "org.springframework.security:spring-security-test"
  asciidoctor 'org.springframework.restdocs:spring-restdocs-asciidoctor:2.0.3.RELEASE'
  testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc:2.0.3.RELEASE'
  implementation "com.amazonaws:aws-java-sdk-s3:1.11.563"
  implementation "com.amazonaws:aws-java-sdk-dynamodb:1.11.563"
  implementation "org.json:json:20180813"
//  implementation 'org.mongodb:mongo-java-driver:3.10.1'
  implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
  implementation 'org.jsoup:jsoup:1.12.1'
  implementation group: 'org.apache.poi', name : 'poi', version: '4.1.0'
  implementation group: 'org.apache.poi', name : 'poi-ooxml', version: '4.1.0'
  implementation group: 'com.google.zxing', name: 'javase', version: '3.2.1'
  implementation project(':ntss-api')
  implementation group: 'org.apache.commons', name: 'commons-csv', version: '1.5'
  // https://mvnrepository.com/artifact/com.google.code.gson/gson
  implementation group: 'com.google.code.gson', name: 'gson', version: '2.8.6'
  implementation 'javax.xml.bind:jaxb-api:2.3.1'
  implementation 'com.sun.xml.bind:jaxb-core:2.3.0'
  implementation 'com.sun.xml.bind:jaxb-impl:2.3.4'
  implementation "org.springframework.boot:spring-boot-starter-validation"
  testCompileOnly 'org.projectlombok:lombok:1.18.28'
  testAnnotationProcessor 'org.projectlombok:lombok:1.18.28'
  implementation "org.springframework.boot:spring-boot-starter-aop"
  implementation "org.seasar.doma.boot:doma-spring-boot-starter:${doma_spring_version}"
  implementation "org.seasar.doma:doma:2.24.0"
  annotationProcessor "org.seasar.doma:doma:2.24.0"
  implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.9'
  implementation group: 'commons-collections', name: 'commons-collections', version: '3.2.2'
  implementation "org.postgresql:postgresql"
  implementation 'io.micrometer:micrometer-core:1.9.2'

  implementation 'info.sun-june.solve:solve-calculate:0.8.4'

}

asciidoctor {
  sourceDir = snippetsDir
  outputDir = apiDocDir
  dependsOn test
}

asciidoctor.doFirst {
  copy {
    from 'src/docs/asciidoc'
    into snippetsDir
  }
}

task apiDoc(dependsOn: asciidoctor) {
}

clean { delete "target" }

task cleanResources(type: Delete) { delete 'build/resources' }

task wrapper(type: Wrapper) { gradleVersion = '7.2' }

task stage(dependsOn: [bootWar, bootJar]) {
}

assemble.dependsOn bootJar

node {
  version = "${node_version}"
  npmVersion = "${npm_version}"
  download = project.hasProperty('nodeInstall')
  // Set the work directory where node_modules should be located
  nodeModulesDir = file("${project.projectDir}/src/main/frontend")
}

tasks.withType(Test) {
    systemProperty "file.encoding", "UTF-8"
}

// Doma2のSQLファイルをJavaのコンパイル前にコピーしておく
// SQLファイルが存在するかしないとJavaのコンパイル時にSQLファイルが存在するかのチェックでエラーになるため。
processResources.destinationDir = compileJava.destinationDir
compileJava.dependsOn processResources

processResources.dependsOn cleanResources, bootBuildInfo
bootBuildInfo.mustRunAfter cleanResources
build.dependsOn asciidoctor

// skip tasks
compileTestJava.onlyIf {project.hasProperty('someProperty')}
npm_install.onlyIf {project.hasProperty('someProperty')}
npmRunLint.onlyIf {project.hasProperty('someProperty')}

