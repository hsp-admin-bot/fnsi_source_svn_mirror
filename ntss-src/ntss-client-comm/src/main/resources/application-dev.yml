spring:
  profiles:
    active: mongo
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.data.mongo.MongoDataAutoConfiguration,
             org.springframework.boot.autoconfigure.mongo.MongoAutoConfiguration
  main:
    allow-circular-references: true
  data:
    mongodb:
      host: 192.168.100.11
      port: 27017
      database: ntss
      username: nkk
      password: nkk
  datasource:
    default:
      jdbc-url: jdbc:postgresql://192.168.100.10:5432/ntss_db5?currentSchema=ntss&stringtype=unspecified
      driver-class-name: org.postgresql.Driver
      username: nkk5
      password: nkk5
    personal:
      jdbc-url: jdbc:postgresql://192.168.100.10:5432/ntss_db6?currentSchema=ntss&stringtype=unspecified
      driver-class-name: org.postgresql.Driver
      username: nkk6
      password: nkk6
    auth:
      jdbc-url: jdbc:postgresql://192.168.100.10:5432/ntss_db4?currentSchema=ntss&stringtype=unspecified
      driver-class-name: org.postgresql.Driver
      username: nkk4
      password: nkk4
  jackson:
    serialization:
      WRITE_DATES_AS_TIMESTAMPS: false
  application:
    name: ntss-client-comm
  jmx:
    default-domain: ntss-client-comm
      
      
doma:
  dialect: postgres
  
logging:
  file.name: /tmp/ntss-client-comm.log
  level:
    org.springframework.transaction.interceptor: TRACE
    
cloud:
  aws:
    region:
      auto: false
      static: ap-northeast-1
    stack:
      auto: false

server:
  port: 8090
  servlet:
    contextPath: /ntss-client-comm
  compression:
    enabled: true
    min-response-size: 1048576 # 1M = 1024 * 1024(bytes)

securityporicy:
  accesskeycheck: true

ntss:
  client-comm:
    serverType: 1
    websocket:
      use: true
      path: /ntssclientcomm
      aliveInterval: 5
    url:
      requestHTTP: http
      # NKK aws
      postMsgAPI_WebAppSrv: :8090/ntss-client-comm/api/sendclient
      postMsgAPI_DeviceSrv: :8080/ntss-client-comm/api/sendclient
      # alive moni
      hostName: localhost:8080
      postDEStatusAPI: /alive_moni/api/response
      postDEStatusDilay: 1
  logging:
    rolling:
      max-history: 14
      max-history-app: 14
---
spring:
  config.activate.on-profile: mongo
  autoconfigure:
    exclude:
